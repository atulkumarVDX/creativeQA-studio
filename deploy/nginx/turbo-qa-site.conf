# Install in /etc/nginx/sites-available/ and enable it in sites-enabled/.
# Replace the domain, certificate, root and password-file placeholders.
server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate __CERT_FILE__;
    ssl_certificate_key __KEY_FILE__;

    root /srv/turbo-qa-studio/current/dist;
    index index.html;

    # Keep the entire application, including the rendering API, behind HTTPS
    # and authentication. Replace with existing company SSO if available.
    auth_basic "Turbo QA Studio";
    auth_basic_user_file /etc/nginx/turbo-qa.htpasswd;

    location = /api/ctv-ott/health {
        proxy_pass http://127.0.0.1:4177/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /api/ctv-ott/render {
        client_max_body_size 1024m;
        limit_conn turbo_qa_render 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:4177/render$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 20m;
        proxy_read_timeout 20m;
        proxy_buffering off;
    }

    location /api/ctv-ott/ {
        return 404;
    }

    # Re-fetch the entry page so each visit uses the current hashed JS/CSS.
    location ~ \.html$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
